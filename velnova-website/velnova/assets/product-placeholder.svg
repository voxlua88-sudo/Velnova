<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="title desc">
  <title id="title">VELNOVA sample product placeholder</title>
  <desc id="desc">Illustration of a generic cleaning product bottle with a clearly marked placeholder label.</desc>
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".48" stop-color="#e5efeb"/>
      <stop offset="1" stop-color="#b9cbc5"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop stop-color="#123f38"/>
      <stop offset="1" stop-color="#287d68"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="181" cy="438" rx="105" ry="17" fill="#123f38" opacity=".12"/>
  <g filter="url(#shadow)">
    <path d="M142 83V51q0-12 12-12h51q12 0 12 12v32l26 22q19 16 19 41v228q0 26-26 26H104q-26 0-26-26V146q0-25 19-41z" fill="url(#body)" stroke="#a9beb7" stroke-width="3"/>
    <path d="M144 84h72v28h-72z" fill="#d4e0dc"/>
    <rect x="137" y="28" width="87" height="43" rx="10" fill="url(#cap)"/>
    <path d="M151 36v26m12-26v26m12-26v26m12-26v26m12-26v26m12-26v26" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
    <path d="M91 159q0-20 18-20h144q18 0 18 20v17H91z" fill="#fff" opacity=".35"/>
    <rect x="97" y="190" width="166" height="150" rx="12" fill="#f8fbfa" stroke="#b6c8c2" stroke-width="2"/>
    <path d="M112 216h136" stroke="#57c3a5" stroke-width="5" stroke-linecap="round"/>
    <text x="180" y="253" fill="#123f38" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" text-anchor="middle">VELNOVA</text>
    <text x="180" y="281" fill="#47635d" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">SAMPLE PRODUCT</text>
    <path d="M124 300h112" stroke="#d3dfdb" stroke-width="2"/>
    <text x="180" y="324" fill="#738780" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">PLACEHOLDER ARTWORK</text>
    <path d="M110 358h140" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  </g>
